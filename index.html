<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset = "UTF-8">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta http-equiv = "X-UA-Compatible" content = "IE=Edge">
	<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
	<meta name = "description" content = "Taylor Eruysal: Game Designer, Artist, Web Creator">
	<meta name = "author" content = "Taylor Eruysal">

	<!-- favicon -->
	<link rel="apple-touch-icon" sizes="180x180" href="/files/icons-logos/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/files/icons-logos/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/files/icons-logos/favicon-16x16.png">
	<link rel="manifest" href="/files/icons-logos/site.webmanifest">

	<!-- style and title -->
	<link rel = "stylesheet" href = "/style.css">
	<title> Welcome! </title>
</head>

<body>
	<div id="INJECT-HEADER-HERE"> <!-- Inject the header here via Javascript. --> </div>

	<main>
		<div class = "card">
			<h2> Welcome! </h2>

			<!-- force the parent container to act as an inline size measurement -->
			<div style = "container-type: inline-size;">
				<!-- use Container Query Width units to automatically scale 3:1 dimensions based on viewing size -->
				<!-- anchor this <div> so its children's "absolute position" layering doesn't stretch beyond its boundaries -->
				<div style = "height: 33cqi; position: relative;">
					<div class = "slide active">
						<img style = "object-fit: cover;" src = "/files/banner/banner1.jpg">
					</div>

					<div class = "slide">
						<img style = "object-fit: cover;" src = "/files/banner/banner2.jpg">
					</div>

					<div class = "slide">
						<img style = "object-fit: cover;" src = "/files/banner/banner3.jpg">
					</div>
				</div>
			</div>

			<p> I'm a game designer, artist, and web creator. Here you can browse my portfolio, along with a blog and some other links to my work. </p>

			<p> Feel free to read more <a href = "/about">about me</a>, look over my <a href = "/projects">work</a> and <a href = "/files/resume_eruysal.pdf"> resume</a>, or <a href = "/about#contact">reach out</a> if you'd like to get in contact. </p>

			<p> Thank you for visiting! </p>
		</div>
	</main>
	
	<footer>
		<p> &copy; Taylor Eruysal <script type = "text/javascript"> document.write((new Date()).getFullYear()); </script> </p>
	</footer>
</body>

<script>
	fetch('/header.html')
		.then(response => response.text())
		.then(data => {
			document.getElementById('INJECT-HEADER-HERE').innerHTML = data;
		});

	let currentSlideIndex = 0;
	const slides = document.querySelectorAll(".slide");

	function showSlide(index) { // loop correctly
		if (index >= slides.length) { currentSlideIndex = 0; }
		else if (index < 0) { currentSlideIndex = slides.length - 1; }
		else { currentSlideIndex = index; }

		// only grant "active" to the current slide
		slides.forEach(slide => slide.classList.remove('active'));
		slides[currentSlideIndex].classList.add('active');
	}

	setInterval(() => { showSlide(currentSlideIndex + 1); }, 2500); //Auto-play slideshow every X seconds
</script>

</html>
