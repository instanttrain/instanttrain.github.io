<!DOCTYPE html>
	<head>
		<meta charset = "UTF-8">
		<meta http-equiv = "X-UA-Compatible" content = "IE=Edge">
		<meta name = "description" content = "Taylor Eruysal: Game Designer, Artist, Web Creator">
		<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
		<link rel = "stylesheet" href = "style.css">
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
		<link rel="manifest" href="site.webmanifest">
		<title> Projects </title>
	</head>

	<body>
		<header class = "header">
			<div id="header-container"></div>
		</header>

		<div class = "row">
			<div class = "left-column">
				<div class = "card">
					<p class = "text"> Coming soon! </p>
				</div>
			</div>
			
			<div class = "right-column">
				<div class = "card">
					<div id="sidebar-container"></div>
				</div>
			</div>
		</div>

		<div class = "footer">
			<p class = "text" style = "color: White; text-align: center;">
				&copy; Taylor Eruysal <script type = "text/javascript"> document.write((new Date()).getFullYear()); </script>
			<p>
		</div>
		
		<script>
			fetch('/header.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('header-container').innerHTML = data;
			});
		
			fetch('/sidebar.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('sidebar-container').innerHTML = data;
			});
		</script>
	</body>
