<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset = "UTF-8">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta http-equiv = "X-UA-Compatible" content = "IE=Edge">
	<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
	<meta name = "description" content = "Taylor Eruysal: Game Designer, Artist, Web Creator">
	<meta name = "author" content = "Taylor Eruysal">

	<!-- favicon -->
	<link rel="apple-touch-icon" sizes="180x180" href="/files/icons-logos/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/files/icons-logos/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/files/icons-logos/favicon-16x16.png">
	<link rel="manifest" href="/files/icons-logos/site.webmanifest">

	<!-- style and title -->
	<link rel = "stylesheet" href = "/style.css">
	<title> Art </title>
</head>

<body>
	<div id="INJECT-HEADER-HERE"> <!-- Inject the header here via Javascript. --> </div>

	<main>
		<div class = "card">
			<p style = "text-align: center;"> (Click the images to enlarge.) </p>

			<h2 style = "line-height:1;">3D Art</h2>

			<div class = "liquid-gallery">
				<img src = "/files/art/mountains.jpg" alt = "Mountains">
				<img src = "/files/art/factory.jpg" alt = "Factory">
				<img src = "/files/art/spaceship-eight.jpg" alt = "Spaceship Eight">
				<img src = "/files/art/bedroom.jpg" alt = "Bedroom">
				<img src = "/files/art/harbor.jpg" alt = "Harbor Assets">
				<img src = "/files/art/kintsu.jpg" alt = "Kintsukuroi">
				<img src = "/files/art/hallway.jpg" alt = "Hallway">
				<img src = "/files/art/turret.jpg" alt = "Turret">
			</div>

			<div style = "clear: both;"></div>
			<h2>2D Art</h2>

			<div class = "liquid-gallery">
				<img src = "/files/art/blacksmith.jpg" alt = "Blacksmith">
				<img src = "/files/art/spacearmor.jpg" alt = "Space Armor">
				<img src = "/files/art/flute.jpg" alt = "flute">
				<img src = "/files/art/birds.jpg" alt = "Birds">
				<img src = "/files/art/hallway.jpg" alt = "Hallway">
				<img src = "/files/art/horse.jpg" alt = "Horse">
			</div>

			<div style = "clear: both;"></div>
			<h2>Fan Art</h2>

			<div class = "liquid-gallery">
				<img src = "/files/art/mina.jpg" alt = "Mina the Hollower (fanart)">
				<img src = "/files/art/mario-redraw.jpg" alt = "Mario (Redraw)">
			</div>
			
			<!-- Lightbox Overlay -->
			<div id="lightbox" class="lightbox">
				<img id="lightbox-img" src="" alt="Enlarged view">
			</div>

			<br> <!-- Line break. -->
		</div>
	</main>
	
	<footer>
		<p> &copy; Taylor Eruysal <script type = "text/javascript"> document.write((new Date()).getFullYear()); </script> </p>
	</footer>
</body>

<script>
	fetch('/header.html')
		.then(response => response.text())
		.then(data => {
			document.getElementById('INJECT-HEADER-HERE').innerHTML = data;
		});
	
	const galleryImages = document.querySelectorAll('.liquid-gallery img');
	const lightbox = document.getElementById('lightbox');
	const lightboxImg = document.getElementById('lightbox-img');

	// Open lightbox when an image is clicked
	galleryImages.forEach(img => {
		img.addEventListener('click', () => {
			lightbox.style.display = 'flex';
			lightboxImg.src = img.src;
		});
	});

	// Close lightbox when clicking anywhere outside the image
	lightbox.addEventListener('click', (e) => {
		if (e.target !== lightboxImg) {
			lightbox.style.display = 'none';
		}
	});
</script>

<noscript> Please enable JavaScript to access the full functionality of this website! </noscript>

</html>
